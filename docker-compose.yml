
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ekycense-backend
    restart: unless-stopped
    env_file:
      - backend/.env
    volumes:
      # Persist DB and mount local data/models into the container
      - backend-data:/app/data
      - ./data:/app/data
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: ekycense-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  backend-data:

